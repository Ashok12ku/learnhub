{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="row justify-content-center py-2">
    <div class="col-lg-7 col-md-9">
        <div class="profile-shell card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-icon">👤</div>
                <h3 class="mt-3 mb-1">My Profile</h3>
                <p class="text-muted mb-0">{{ user.role|title }} account</p>
            </div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
